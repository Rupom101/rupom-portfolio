<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rupom Ahmed | Portfolio</title>

    <link rel="stylesheet" href="site.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fa;
            color: #222;
            line-height: 1.6;
        }

        nav {
            background: #111827;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            color: white;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .hero {
            min-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 70px;
            padding: 50px 8%;
            background: white;
        }

        .hero-text {
            max-width: 600px;
        }

        .hero-text h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .hero-text h1 span {
            color: #2563eb;
        }

        .hero-text h3 {
            color: #555;
            margin-bottom: 20px;
        }

        .hero-text p {
            color: #666;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 12px 25px;
            border-radius: 6px;
            text-decoration: none;
        }

        .hero-img img {
            width: 260px;
            height: 260px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #2563eb;
        }

        section {
            padding: 70px 8%;
        }

        section h2 {
            text-align: center;
            margin-bottom: 35px;
            font-size: 32px;
        }

        .about {
            background: #f5f7fa;
            text-align: center;
        }

        .about p {
            max-width: 750px;
            margin: auto;
            color: #555;
        }

        .skills {
            background: white;
        }

        .skill-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .skill {
            background: #eef2ff;
            padding: 12px 22px;
            border-radius: 6px;
            font-weight: bold;
        }

        .contact {
            background: #111827;
            color: white;
            text-align: center;
        }

        .contact p {
            margin: 10px 0;
        }

        footer {
            background: #080b11;
            color: white;
            text-align: center;
            padding: 18px;
        }

        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                gap: 10px;
            }

            .hero {
                flex-direction: column-reverse;
                text-align: center;
            }

            .hero-text h1 {
                font-size: 36px;
            }

            .hero-img img {
                width: 210px;
                height: 210px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <h2>Rupom Ahmed</h2>

        <div>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#skills">Skills</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <section class="hero" id="home">

        <div class="hero-text">
            <h1>Hello, I'm <span>Rupom Ahmed</span></h1>

            <h3>Web Developer & Cyber Security Learner</h3>
